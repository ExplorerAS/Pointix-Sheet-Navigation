name: Publish stable release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-trigger-1.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "1.1.0" >/dev/null 2>&1; then
            echo "Release 1.1.0 already exists."
            exit 0
          fi
          gh release create "1.1.0" \
            main.js manifest.json styles.css \
            --title "Pointix Sheet Navigation v1.1.0" \
            --notes "Stable release. Touch/pen pan navigation plus Alt/Option + left-drag navigation on desktop." \
            --target main
