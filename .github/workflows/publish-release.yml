name: Publish stable release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-trigger-1.1.2"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "1.1.2" >/dev/null 2>&1; then
            echo "Release 1.1.2 already exists."
            exit 0
          fi
          gh release create "1.1.2" \
            main.js manifest.json styles.css \
            --title "Pointix Sheet Navigation v1.1.2" \
            --notes "Submission-readiness release. Adds MIT licensing and updates plugin metadata. Navigation behavior is unchanged from v1.1.1." \
            --target main
